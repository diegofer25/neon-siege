name = "neon-siege-api"
main = "src/index.ts"
compatibility_date = "2024-09-25"
compatibility_flags = ["nodejs_compat"]

[[routes]]
pattern = "neon-siege-server.diegolamarao.com"
custom_domain = true

# ─── D1 Database ────────────────────────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "neon-siege-db"
database_id = "509ef32b-f161-4bd8-b799-57ae9ddde30f"
migrations_dir = "migrations"

# ─── KV Namespace (rate limiting) ───────────────────────────────────────────
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "08a380066c5e4582919592d9b4153202"

# ─── Environment: Preview ───────────────────────────────────────────────────
[env.preview]
name = "neon-siege-api-preview"
workers_dev = true
routes = []

[[env.preview.d1_databases]]
binding = "DB"
database_name = "neon-siege-db-preview"
database_id = "f8909d15-5579-42c8-8acc-9044b51549e8"
migrations_dir = "migrations"

[[env.preview.kv_namespaces]]
binding = "RATE_LIMIT"
id = "ebe209bb3d4c4edd9eab4a41dc2fb336"

[env.preview.vars]
NODE_ENV = "production"
APP_BASE_URL = "https://staging.neon-siege.pages.dev"
EMAIL_FROM = "Neon Siege <noreply@diegolamarao.com>"
GEOIP_ENABLED = "true"
ALLOWED_ORIGINS = "https://staging.neon-siege.pages.dev"
ALLOWED_CHECKOUT_HOSTS = "staging.neon-siege.pages.dev"
FEEDBACK_EMAIL = "diego.lamarao92@gmail.com"

# ─── Secrets (set via `wrangler secret put <KEY>`) ──────────────────────────
# JWT_SECRET
# JWT_REFRESH_SECRET
# SCORE_HMAC_SECRET
# SAVE_HMAC_SECRET
# CONTINUE_TOKEN_SECRET
# GOOGLE_CLIENT_ID
# STRIPE_SECRET_KEY
# STRIPE_WEBHOOK_SECRET
# STRIPE_PRICE_ID
# RESEND_API_KEY

# ─── Vars (non-secret config) ──────────────────────────────────────────────
[vars]
NODE_ENV = "production"
APP_BASE_URL = "https://neon-siege.diegolamarao.com"
EMAIL_FROM = "Neon Siege <noreply@diegolamarao.com>"
GEOIP_ENABLED = "true"
ALLOWED_ORIGINS = "https://neon-siege.diegolamarao.com"
ALLOWED_CHECKOUT_HOSTS = "neon-siege.diegolamarao.com"
# Feedback / bug-report email recipient (configurable)
FEEDBACK_EMAIL = "diego.lamarao92@gmail.com"
